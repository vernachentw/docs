<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    />
    <link
      href="./assets/fontawesome-free-6.7.2-web/css/fontawesome.min.css"
      rel="stylesheet"
    />
    <link
      href="./assets/fontawesome-free-6.7.2-web/css/solid.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/docsify-plugin-toc@1.3.1/dist/light.css"
    />
    <!-- <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/gh/LIGMATV/docsify-navbar-fixed/navbar-fixed.css"
    /> -->

    <!-- <link rel="stylesheet" href="./style/style.css" /> -->
    <link rel="stylesheet" href="./style/cus-style.css" />

    <style>
      /* 
      這個會造成 跳到 data-id, class anchor 失效
      main {  
        position: fixed;
        top: 50px;
      } */

      /* .content {
        overflow: auto;
        padding-bottom: 30px;
      } */
    </style>
  </head>
  <body>
    <!-- <nav>
      <ul>
        <li><a href="#/">English</a></li>
        <li><a href="#/tw/">繁體中文</a></li>
      </ul>
    </nav> -->
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: '',
        repo: '',
        loadNavbar: true, // _navbar.md, 無法載入對應的 _sidebar.md
        loadSidebar: true, // _sidebar.md

        homepage: 'README.md',
        auto2top: true,

        sidebar: {
          '/': '_sidebar.md',
          '/en/': '_sidebar.md', // 英文語言加載 _sidebar.md
          '/tw/': '_sidebar.md', // 繁體中文語言加載 _sidebar.md
        },

        alias: {
          '/_navbar.md': '/en/_navbar.md',
          '/tw/.*/_navbar.md': '/tw/_navbar.md',
          '/en/.*/_navbar.md': '/en/_navbar.md',

          '/tw/.*/_sidebar.md': '/tw/_sidebar.md',
          '/en/.*/_sidebar.md': '/en/_sidebar.md',
          '/_sidebar.md': '/en/_sidebar.md',
        },

        // subMaxLevel: 2, // 暫不使用

        search: {
          maxAge: 86400000, // 搜尋結果緩存一天
          placeholder: {
            '/tw/': '搜索',
            '/': 'Search',
          },

          // Localization
          noData: {
            '/tw/': '找不到结果',
            '/': 'No Results',
            '/en/': 'No Results',
          },

          // // 搜索标题的最大层级, 1 - 6
          depth: 3,

          pathNamespaces: /^(\/(tw|en))?/,
        },

        toc: {
          tocMaxLevel: 5,
          target: 'h2, h3, h4, h5, h6',
          ignoreHeaders: [
            '<!-- {docsify-ignore} -->',
            '<!-- {docsify-ignore-all} -->',
          ],
        },
      };
    </script>
    <!-- Docsify v4 -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
    <!-- plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/front-matter.min.js"></script>
    <script src="https://unpkg.com/docsify-plugin-toc@1.3.1/dist/docsify-plugin-toc.min.js"></script>
  </body>
</html>
